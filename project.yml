# XcodeGen spec for Plyne. This file is the source of truth — Plyne.xcodeproj
# is generated by `xcodegen generate` and is intentionally gitignored.

name: Plyne

options:
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  defaultConfig: Debug
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_PREVIEWS: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      SWIFT_COMPILATION_MODE: incremental
      ENABLE_HARDENED_RUNTIME: NO
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      SWIFT_COMPILATION_MODE: wholemodule
      # Hardened runtime is intentionally OFF until we have a Developer ID
      # certificate and a real notarization pipeline. Turning it on while
      # signing ad-hoc (and with CODE_SIGNING_ALLOWED=NO in release.yml) only
      # *looks* secure — the runtime flag never makes it onto the final binary.
      # See ADR/notes when notarization is wired up.
      ENABLE_HARDENED_RUNTIME: NO
      ONLY_ACTIVE_ARCH: NO
      # Universal binary for releases.
      ARCHS: "$(ARCHS_STANDARD)"

packages:
  PlyneCore:
    path: Packages/PlyneCore
  PlyneTimer:
    path: Packages/PlyneTimer
  PlyneAnalytics:
    path: Packages/PlyneAnalytics
  PlyneStorage:
    path: Packages/PlyneStorage
  PlyneCalendar:
    path: Packages/PlyneCalendar

targets:
  Plyne:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "Plyne.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.plyne.Plyne
        PRODUCT_NAME: Plyne
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Plyne.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: PlyneCore
        product: PlyneCore
      - package: PlyneTimer
        product: PlyneTimer
      - package: PlyneAnalytics
        product: PlyneAnalytics
      - package: PlyneStorage
        product: PlyneStorage
      - package: PlyneCalendar
        product: PlyneCalendar
